---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-random-deploy
spec:
  replicas:
  selector:
    matchLabels:
      app: python-random
  template:
    metadata:
      labels:
        app: python-random
    spec:
      containers:
      - name: app-container
        image: morebeer201986/hw24-python-app:v1
        ports:
        - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: python-random-svc
spec:
  type: NodePort
  selector:
    app: python-random
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8082
