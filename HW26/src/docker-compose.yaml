version: '3.8'

services:

  nodejs-app:
    build:
      context: ./app
    ports:
      - "3000:10000"
    depends_on:
      - fluentd

    logging:
      driver: "fluentd"
      options:
        fluentd-address: localhost:24224
        tag: nodejs.app

  fluentd:
    build: ./fluentd
    volumes:
      - ./fluentd/conf:/fluentd/etc
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    depends_on:
      - elasticsearch

  elasticsearch:
    image: elasticsearch:8.10.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

  kibana:
    image: kibana:8.10.2
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
